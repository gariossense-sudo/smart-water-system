<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Smart Water System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #15313a; background: linear-gradient(145deg, #e8f8f6, #f4f8fc);
    }
    main {
      width: min(100%, 680px); padding: 36px 28px; text-align: center;
      background: #fff; border: 1px solid #dcebe9; border-radius: 24px;
      box-shadow: 0 18px 50px rgba(16, 70, 76, .10);
    }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 20px; display: grid; place-items: center;
      border-radius: 22px; color: white; background: #0f766e; font-size: 38px;
    }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 42px); letter-spacing: -.8px; }
    p { margin: 12px auto 0; max-width: 470px; line-height: 1.7; color: #587078; }
    .status {
      display: inline-flex; align-items: center; gap: 9px; margin-top: 26px;
      padding: 10px 15px; border-radius: 999px; background: #e8f7ef;
      color: #187348; font-weight: 650; font-size: 14px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #20a464; }
    footer { margin-top: 28px; color: #8a9ba0; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">💧</div>
    <h1>Smart Water System</h1>
    <p>Selamat datang di website Smart Water System. Halaman ini merupakan halaman awal proyek dan sudah siap diterbitkan secara online.</p>
    <div class="status"><span class="dot"></span> Halaman website siap dipublikasikan</div>
    <footer>Smart Water System · Website proyek</footer>
  </main>
</body>
</html>
